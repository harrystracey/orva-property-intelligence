services:

  # --- NEW: ORVA Web App (Next.js + FastAPI) ---

  api:
    build:
      context: .
      dockerfile: orva_api/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      WA_HOST_1: "wa-1"
      WA_HOST_2: "wa-2"
    volumes:
      - ./data:/app/data
      - ./lead_database:/app/lead_database
      - ./scraped_data:/app/scraped_data
      - ./client_data:/app/client_data
      - ./chat_history:/app/chat_history
      - ./whatsapp_bot:/app/whatsapp_bot
    restart: unless-stopped

  web:
    build:
      context: ./orva-web
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - api

  # --- LEGACY: Streamlit app (runs until cutover) ---

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      WA_HOST_1: "wa-1"
      WA_HOST_2: "wa-2"
    volumes:
      - ./data:/app/data
      - ./lead_database:/app/lead_database
      - ./scraped_data:/app/scraped_data
      - ./logs:/app/logs
      - ./client_data:/app/client_data
      - ./chat_history:/app/chat_history
      - ./credentials.yaml:/app/credentials.yaml:ro
    restart: unless-stopped

  wa-1:
    build:
      context: .
      dockerfile: whatsapp_bot/playwright_server/Dockerfile
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      WA_PORT: "3001"
      WA_PROFILE: "profile1"
      WA_ACCOUNT: "1"
      WA_DATA_DIR: "/app/data"
    volumes:
      - ./data:/app/data
      - ./whatsapp_bot/playwright_server/chrome_profile:/app/chrome_profile
    restart: unless-stopped

  wa-2:
    build:
      context: .
      dockerfile: whatsapp_bot/playwright_server/Dockerfile
    ports:
      - "3002:3002"
    env_file: .env
    environment:
      WA_PORT: "3002"
      WA_PROFILE: "profile2"
      WA_ACCOUNT: "2"
      WA_DATA_DIR: "/app/data"
    volumes:
      - ./data:/app/data
      - ./whatsapp_bot/playwright_server/chrome_profile:/app/chrome_profile
    restart: unless-stopped
