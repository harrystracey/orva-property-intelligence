services:

  # ORVA platform: FastAPI backend + Next.js frontend + 2 WhatsApp bots.
  # The legacy Streamlit service was removed in Phase 4 of the SaaS
  # conversion -- orva-web is now the only UI.

  api:
    build:
      context: .
      dockerfile: orva_api/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      WA_HOST_1: "wa-1"
      WA_HOST_2: "wa-2"
    volumes:
      - ./data:/app/data
      - ./lead_database:/app/lead_database
      - ./scraped_data:/app/scraped_data
      - ./client_data:/app/client_data
      - ./chat_history:/app/chat_history
      - ./whatsapp_bot:/app/whatsapp_bot
    restart: unless-stopped

  web:
    build:
      context: ./orva-web
      # No build args -- the Dockerfile defaults NEXT_PUBLIC_API_URL to empty
      # so the bundle uses relative URLs and nginx (on the host) proxies
      # /api/* to the api container. No mixed-content blocking on HTTPS,
      # no CORS preflight needed.
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - api

  wa-1:
    build:
      context: .
      dockerfile: whatsapp_bot/playwright_server/Dockerfile
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      WA_PORT: "3001"
      WA_PROFILE: "profile1"
      WA_ACCOUNT: "1"
      WA_DATA_DIR: "/app/data"
    volumes:
      - ./data:/app/data
      - ./whatsapp_bot/playwright_server/chrome_profile:/app/chrome_profile
    restart: unless-stopped

  wa-2:
    build:
      context: .
      dockerfile: whatsapp_bot/playwright_server/Dockerfile
    ports:
      - "3002:3002"
    env_file: .env
    environment:
      WA_PORT: "3002"
      WA_PROFILE: "profile2"
      WA_ACCOUNT: "2"
      WA_DATA_DIR: "/app/data"
    volumes:
      - ./data:/app/data
      - ./whatsapp_bot/playwright_server/chrome_profile:/app/chrome_profile
    restart: unless-stopped
