# Alembic configuration for ORVA
#
# The actual schema lives in database.py (SCHEMA_SQL + ensure_tenant_columns);
# Alembic is here so future schema changes are versioned + reversible. The
# initial revision is a stamp-in-place that captures whatever the current
# database.py state produces -- migrations only diverge from there.
#
# Run:
#   alembic upgrade head        # apply all pending migrations
#   alembic revision -m "msg"   # generate a new revision
#   alembic history             # see what's applied
#   alembic current             # current revision in the DB

[alembic]
# Path to the migration environment relative to this file
script_location = alembic

# DB URL -- override via env var ORVA_DB_URL.
# Default points at the local SQLite file the platform uses.
sqlalchemy.url = sqlite:///data/palm_intelligence.db

# Template used to generate filenames for new migrations
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Don't truncate timezone info on timestamps inside revision files
timezone = UTC

# Don't try to enforce a max length on slugs (default 40 is fine)
truncate_slug_length = 40

# Set to "true" to run the environment during the "revision" command,
# regardless of autogenerate. Saves a step.
revision_environment = false

# Set to "true" to allow .pyc and .pyo files without a source .py file
sourceless = false

# Ignore version_path_separator warnings
version_path_separator = os

# Prepend the project root to sys.path so `database` is importable
# inside env.py
prepend_sys_path = .

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
