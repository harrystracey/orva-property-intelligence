<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs><style>text{font-family:-apple-system,'Segoe UI',Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}</style></defs>
  <rect width="1280" height="760" fill="#faf9f6"/>
  <!-- Navbar -->
  <rect width="1280" height="48" fill="#ffffff" stroke="#e5e1d8" stroke-width="1"/>
  <text x="20" y="27" class="serif" font-size="14" font-weight="300" letter-spacing="3" fill="#1a1a1a">ORVA</text>
  <text x="20" y="39" font-size="7" letter-spacing="2" fill="#8a8578">PROPERTY INTELLIGENCE</text>
  <text x="110" y="29" font-size="12" fill="#8a8578" text-anchor="middle">Leads</text>
  <text x="175" y="29" font-size="12" fill="#8a8578">Follow-Ups</text>
  <text x="258" y="29" font-size="12" fill="#8a8578">Rentals</text>
  <text x="330" y="29" font-size="12" fill="#8a8578">WhatsApp</text>
  <text x="480" y="29" font-size="12" fill="#8a8578">Contacts</text>
  <rect x="540" y="10" width="50" height="28" rx="6" fill="#b8860b" fill-opacity="0.15"/>
  <text x="565" y="29" font-size="12" font-weight="600" fill="#b8860b" text-anchor="middle">HLM</text>

  <!-- Left sidebar -->
  <rect x="0" y="48" width="240" height="712" fill="white" stroke="#e5e1d8" stroke-width="1"/>
