<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1117; font-family: sans-serif; overflow-x: hidden; }
  #controls {
    display: flex; align-items: center; gap: 14px;
    padding: 8px 12px; background: #1a1d27; border-bottom: 1px solid #333;
    flex-wrap: wrap;
  }
  #controls label { color: #ccc; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  #brushRange { width: 120px; accent-color: #10b981; }
  #brushVal { color: #10b981; font-weight: bold; min-width: 32px; }
  button {
    padding: 5px 14px; border-radius: 5px; border: none;
    cursor: pointer; font-size: 13px; font-weight: 600;
  }
  #clearBtn { background: #444; color: #fff; }
  #clearBtn:hover { background: #666; }
  #applyBtn { background: #10b981; color: #fff; }
  #applyBtn:hover { background: #059669; }
  #hint { color: #888; font-size: 12px; }
  #canvasWrap { width: 100%; overflow: hidden; }
  #display { display: block; width: 100%; cursor: crosshair; touch-action: none; }
</style>
</head>
<body>
<div id="controls">
  <label>Brush size:
    <input type="range" id="brushRange" min="5" max="120" value="30">
    <span id="brushVal">30px</span>
  </label>
  <button id="clearBtn">&#8634; Clear</button>
  <button id="applyBtn">&#10003; Apply Mask</button>
  <span id="hint">Paint over the watermark, then click Apply Mask</span>
</div>
<div id="canvasWrap">
  <canvas id="display"></canvas>
</div>

<script>
  const display  = document.getElementById('display');
  const dctx     = display.getContext('2d');
  const brushRange = document.getElementById('brushRange');
  const brushVal   = document.getElementById('brushVal');

  // Hidden mask canvas — white where painted, black elsewhere
  const maskCv  = document.createElement('canvas');
  const mctx    = maskCv.getContext('2d');

  let bgImg    = null;
  let painting = false;
  let brush    = 30;

  brushRange.addEventListener('input', () => {
    brush = parseInt(brushRange.value);
    brushVal.textContent = brush + 'px';
  });

  // ---- Streamlit communication ----
  function sendReady() {
    window.parent.postMessage({ isStreamlitMessage: true, type: 'streamlit:componentReady', apiVersion: 1 }, '*');
  }
  function sendHeight(h) {
    window.parent.postMessage({ isStreamlitMessage: true, type: 'streamlit:setFrameHeight', height: h }, '*');
  }
  function sendValue(val) {
    window.parent.postMessage({ isStreamlitMessage: true, type: 'streamlit:setComponentValue', value: val, dataType: 'json' }, '*');
  }

  window.addEventListener('message', (ev) => {
    if (!ev.data || ev.data.type !== 'streamlit:render') return;
    const args = ev.data.args || {};
    if (!args.image_b64) return;

    if (args.brush_size) {
      brush = args.brush_size;
      brushRange.value = brush;
      brushVal.textContent = brush + 'px';
    }

    const img = new Image();
    img.onload = () => {
      bgImg = img;
      // Scale to fill container width (max 1200px)
      const W = Math.min(img.width, window.innerWidth || 1200);
      const H = Math.round(W * img.height / img.width);
      display.width  = W;
      display.height = H;
      maskCv.width   = W;
      maskCv.height  = H;
      mctx.fillStyle = 'black';
      mctx.fillRect(0, 0, W, H);
      dctx.drawImage(img, 0, 0, W, H);
      sendHeight(H + 56);
    };
    img.src = args.image_b64;
  });

  // ---- Drawing ----
  function getPos(e) {
    const r = display.getBoundingClientRect();
    const scX = display.width  / r.width;
    const scY = display.height / r.height;
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - r.left) * scX, y: (src.clientY - r.top) * scY };
  }

  function paintAt(x, y) {
    const r = brush / 2;
    // Display: semi-transparent red
    dctx.beginPath(); dctx.arc(x, y, r, 0, Math.PI * 2);
    dctx.fillStyle = 'rgba(255,50,50,0.55)'; dctx.fill();
    // Mask: solid white
    mctx.beginPath(); mctx.arc(x, y, r, 0, Math.PI * 2);
    mctx.fillStyle = 'white'; mctx.fill();
  }

  display.addEventListener('mousedown',  e => { painting = true;  paintAt(...Object.values(getPos(e))); });
  display.addEventListener('mousemove',  e => { if (painting) paintAt(...Object.values(getPos(e))); });
  display.addEventListener('mouseup',    () => painting = false);
  display.addEventListener('mouseleave', () => painting = false);
  display.addEventListener('touchstart', e => { e.preventDefault(); painting = true;  paintAt(...Object.values(getPos(e))); }, {passive:false});
  display.addEventListener('touchmove',  e => { e.preventDefault(); if (painting) paintAt(...Object.values(getPos(e))); }, {passive:false});
  display.addEventListener('touchend',   () => painting = false);

  document.getElementById('clearBtn').addEventListener('click', () => {
    if (!bgImg) return;
    dctx.drawImage(bgImg, 0, 0, display.width, display.height);
    mctx.fillStyle = 'black';
    mctx.fillRect(0, 0, maskCv.width, maskCv.height);
  });

  document.getElementById('applyBtn').addEventListener('click', () => {
    sendValue(maskCv.toDataURL('image/png'));
  });

  sendReady();
</script>
</body>
</html>
